# 메인 화면 첫 장면 영상 목록 자동 갱신
#
# assets/video/ 에 영상을 올리거나 지우면 assets/data/hero-videos.json 을 다시 만들어
# 같은 브랜치에 커밋합니다. 메인 화면은 이 목록을 읽어 영상을 차례로 재생합니다.
name: 메인 영상 목록 갱신

on:
  push:
    branches: [master]
    paths:
      - "assets/video/**"
      - "automation/build-hero-videos.js"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hero-videos
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 영상 목록 만들기
        run: node automation/build-hero-videos.js
      - name: 변경분 커밋
        run: |
          if [ -z "$(git status --porcelain assets/data/hero-videos.json)" ]; then
            echo "변경사항 없음"; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/hero-videos.json
          git commit -m "메인 영상 목록 자동 갱신 [skip ci]"
          git pull --rebase origin master
          git push
