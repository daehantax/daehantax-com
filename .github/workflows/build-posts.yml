# 게시글 페이지 자동 생성
#
# assets/data/*.json 이 바뀌면 post/<slug>.html 과 sitemap.xml 을 다시 만들어
# 같은 브랜치에 커밋합니다. 매월 자동 리서치 PR을 병합하기만 하면 새 글 페이지가
# 저절로 생기므로, 따로 스크립트를 돌릴 필요가 없습니다.
name: 게시글 페이지 자동 생성

on:
  push:
    branches: [master]
    paths:
      - "assets/data/tax-tips.json"
      - "assets/data/law-updates.json"
      - "automation/build-posts.js"
      - ".github/workflows/build-posts.yml"
  workflow_dispatch:

# 생성 결과를 저장소에 되돌려 커밋하기 위해 쓰기 권한이 필요합니다.
permissions:
  contents: write

concurrency:
  group: build-posts
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 게시글 페이지 · sitemap 생성
        run: node automation/build-posts.js

      - name: 변경분 커밋
        run: |
          if [ -z "$(git status --porcelain post sitemap.xml)" ]; then
            echo "변경사항 없음 — 커밋 생략"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add post sitemap.xml
          # [skip ci] 로 이 커밋이 워크플로를 다시 트리거하지 않게 한다
          git commit -m "게시글 페이지·sitemap 자동 생성 [skip ci]"
          git push
